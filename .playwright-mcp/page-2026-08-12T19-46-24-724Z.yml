    - generic [ref=f13e17]:
      - paragraph [ref=f13e18]: Resume & Apply
      - heading "Resume, LinkedIn & When to Apply" [level=1] [ref=f13e19]
      - paragraph [ref=f13e20]: The technical skills only matter if a resume and a LinkedIn profile get someone to look at them. This page covers the rewrite, the keywords, who to target, and exactly when to start.
    - heading "When to start applying" [level=2] [ref=f13e21]
    - paragraph [ref=f13e23]:
      - strong [ref=f13e24]: Week 12
      - text: — not "when everything feels ready." By week 12 you'll have Portfolio Projects 1 and 2 published and a rewritten resume; that's enough to start getting screens while Module 5 and Project 3 finish in parallel. See the full picture on the
      - link "Roadmap" [ref=f13e25] [cursor=pointer]:
        - /url: roadmap.html
      - text: .
    - 'heading "Translate the resume: skill map" [level=2] [ref=f13e26]'
    - paragraph [ref=f13e27]: Every "soft" marketing skill has a hard analytical shadow. Name it — don't discard the marketing experience, reframe it.
