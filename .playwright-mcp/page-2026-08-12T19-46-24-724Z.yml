    - paragraph [ref=f13e112]:
      - text: "LinkedIn headline:"
      - emphasis [ref=f13e113]: "\"Marketing Manager → Marketing Analyst | SQL, GA4, Tableau | Turning campaign data into revenue decisions.\""
      - text: The arrow signals "in transition, actively upskilled," not a mismatch between title and target.
    - heading "Target roles & titles" [level=2] [ref=f13e114]
    - paragraph [ref=f13e115]: Search all of these — titles are inconsistent across companies, and narrowing to only "Marketing Analyst" cuts the funnel by more than half.
    - list [ref=f13e116]:
      - listitem [ref=f13e117]: Marketing Analyst
      - listitem [ref=f13e118]: Growth Analyst / Growth Marketing Analyst
      - listitem [ref=f13e119]: Campaign Performance Analyst
      - listitem [ref=f13e120]: Customer Insights Analyst
      - listitem [ref=f13e121]: Digital Analytics Specialist / Analyst
      - listitem [ref=f13e122]: Marketing Data Analyst
      - listitem [ref=f13e123]: CRM Analyst
      - listitem [ref=f13e124]: Web Analyst
    - heading "Application strategy" [level=2] [ref=f13e125]
    - paragraph [ref=f13e127]:
      - strong [ref=f13e128]: ~20% cold applications, ~60% warm networking/referrals, ~20% recruiter outreach.
      - text: Referred candidates get interviewed at multiples the rate of cold applicants — for a career-changer without the "safe" title match, a referral is often what gets the resume read at all instead of filtered by an ATS keyword match.
    - heading "Cold outreach templates" [level=3] [ref=f13e129]
    - generic [ref=f13e130]:
      - text: To a recruiter
      - paragraph [ref=f13e131]: Hi [Name] — I saw you recruit for marketing/growth analytics roles at [Company]. I'm a Marketing Manager transitioning into Marketing/Growth Analyst work — I've spent [X years] running campaigns and reading performance data, and I've spent the last few months building hands-on SQL, GA4, and dashboarding skills to formalize that into an analyst skillset (happy to share a portfolio piece on campaign ROI analysis). Would love to be on your radar for analyst-track roles you're working — open to a quick chat if it's useful, no pressure either way.
    - generic [ref=f13e132]:
      - text: To a Senior Marketing Analyst
      - paragraph [ref=f13e133]: "Hi [Name] — I came across your profile and saw you made a similar move into analytics from a more marketing-generalist background. I'm a Marketing Manager currently building out SQL/GA4/dashboard skills to move into a Marketing Analyst role, and I'd genuinely value 15 minutes of your perspective — mainly: what actually mattered in your first 90 days that a course wouldn't have taught you? Completely understand if time's tight — even a two-line reply would help."
