    - heading "Interview questions for this module" [level=2] [ref=f5e148]
    - generic [ref=f5e149]:
      - paragraph [ref=f5e150]: "\"Walk me through how you'd approach a completely new dataset you've never seen before.\""
      - paragraph [ref=f5e151]: "Model answer: start with the grain (what does one row represent?), check for obvious data quality issues (nulls, duplicates, date ranges), then re-state the business question before writing a single query — most bad analysis comes from skipping this and jumping straight to a pivot table."
    - generic [ref=f5e152]:
      - paragraph [ref=f5e153]: "\"What's the difference between a metric and a dimension?\""
      - paragraph [ref=f5e154]: "Model answer: a metric is a number you aggregate (revenue, clicks, sessions); a dimension is a category you group or filter by (channel, region, device). Every chart or query is really \"which metric, sliced by which dimension.\""
