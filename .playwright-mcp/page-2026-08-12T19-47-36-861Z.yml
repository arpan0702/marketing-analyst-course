    - heading "Interview questions for this module" [level=2] [ref=f16e167]
    - generic [ref=f16e168]:
      - paragraph [ref=f16e169]: "\"How would you use a pivot table to find your top 5 campaigns by ROI?\""
      - paragraph [ref=f16e170]: "Model answer: rows = campaign name, values = sum of revenue and sum of spend (or a calculated ROI field), sort descending on the ROI value, filter to top 5 — then say what you'd do with that list, not just how you built it."
    - generic [ref=f16e171]:
      - paragraph [ref=f16e172]: "\"What's the difference between VLOOKUP and XLOOKUP, and why does it matter?\""
      - paragraph [ref=f16e173]: "Model answer: VLOOKUP only searches left-to-right and breaks if columns are reordered; XLOOKUP searches in either direction, returns a clean error value, and doesn't break when columns move. Mentioning XLOOKUP by name signals current tooling, not a 2015-era spreadsheet habit."
