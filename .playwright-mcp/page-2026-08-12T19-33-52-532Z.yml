    - generic [ref=f9e15]:
      - paragraph [ref=f9e16]: Module 5
      - heading "Marketing Metrics, A/B Testing & Statistical Fundamentals" [level=1] [ref=f9e17]
      - paragraph [ref=f9e18]: CAC, LTV, ROAS, hypothesis testing, confidence — where "analyst" stops being a title and starts being a way of thinking.
    - heading "Core concepts" [level=2] [ref=f9e19]
    - list [ref=f9e20]:
      - listitem [ref=f9e21]:
        - strong [ref=f9e22]: CAC
        - text: (Customer Acquisition Cost) = spend ÷ new customers.
      - listitem [ref=f9e23]:
        - strong [ref=f9e24]: LTV
        - text: (Lifetime Value) = avg. order value × purchase frequency × customer lifespan.
      - listitem [ref=f9e25]:
        - strong [ref=f9e26]: ROAS
        - text: (Return on Ad Spend) = revenue ÷ spend. Healthy
        - strong [ref=f9e27]: "LTV : CAC"
        - text: is roughly 3:1 or better.
      - listitem [ref=f9e28]:
        - strong [ref=f9e29]: Statistical significance
        - text: ": whether an observed difference (e.g. Variant B's conversion rate) is likely real, or just noise."
      - listitem [ref=f9e30]:
        - strong [ref=f9e31]: Sample size / peeking risk
        - text: ": checking significance too early inflates false positives — a test that looks \"significant\" on day 3 can flip by day 14."
    - generic [ref=f9e32]:
      - paragraph [ref=f9e33]: acquisition funnel with metric at each stage
