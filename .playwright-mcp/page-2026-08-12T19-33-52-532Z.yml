    - heading "Exercises" [level=2] [ref=f9e91]
    - list [ref=f9e92]:
      - listitem [ref=f9e93]: Using the calculators above, try a scenario where LTV:CAC is under 2:1 — write one sentence recommending what you'd do.
      - listitem [ref=f9e94]: Using the Kaggle "Marketing A/B Testing" dataset, calculate conversion rate for each group, then check significance (Sheets has a built-in chi-square function) against this page's calculator.
      - listitem [ref=f9e95]: In the significance calculator, drop Variant B's visitor count to 500 with the same conversion rate — watch the result flip. Write two sentences on why that matters when a stakeholder wants to end a test early.
