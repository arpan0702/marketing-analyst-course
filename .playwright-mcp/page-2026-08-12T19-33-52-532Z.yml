    - heading "Interview questions for this module" [level=2] [ref=f9e166]
    - generic [ref=f9e167]:
      - paragraph [ref=f9e168]: "\"How do you explain statistical significance to a stakeholder with no stats background?\""
      - paragraph [ref=f9e169]: "Model answer: \"It's how confident we are the difference we're seeing is a real effect, not random noise from a small sample — like flipping a coin 10 times and getting 7 heads doesn't mean the coin is rigged, but 700 heads out of 1,000 flips would.\""
    - generic [ref=f9e170]:
      - paragraph [ref=f9e171]: "\"If LTV:CAC is 1.5:1, what does that tell you and what would you recommend?\""
      - paragraph [ref=f9e172]: "Model answer: unsustainable — the cost of acquiring a customer is too close to what they're worth over their lifetime, leaving little margin for overhead or profit. Recommend either reducing CAC by channel (cut underperforming spend) or increasing retention/LTV (lifecycle marketing) before scaling acquisition spend further."
    - generic [ref=f9e173]:
      - paragraph [ref=f9e174]: "\"How would you determine if you have enough sample size to trust an A/B test result?\""
      - paragraph [ref=f9e175]: "Model answer: run a sample-size calculation before launch based on baseline conversion rate and minimum detectable effect, and commit to that sample size and duration up front — don't stop the test early just because it looks significant on day 3, since that inflates the false-positive rate."
