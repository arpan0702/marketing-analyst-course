    - heading "Interview questions for this module" [level=2] [ref=f23e248]
    - generic [ref=f23e249]:
      - paragraph [ref=f23e250]: "\"How would you use a pivot table to find your top 5 campaigns by ROI?\""
      - paragraph [ref=f23e251]: "Model answer: rows = campaign name, values = sum of revenue and sum of spend (or a calculated ROI field), sort descending on the ROI value, filter to top 5 — then say what you'd do with that list, not just how you built it."
    - generic [ref=f23e252]:
      - paragraph [ref=f23e253]: "\"What's the difference between VLOOKUP and XLOOKUP, and why does it matter?\""
      - paragraph [ref=f23e254]: "Model answer: VLOOKUP only searches left-to-right and breaks if columns are reordered; XLOOKUP searches in either direction, returns a clean error value, and doesn't break when columns move. Mentioning XLOOKUP by name signals current tooling, not a 2015-era spreadsheet habit."
    - generic [ref=f23e255]:
      - paragraph [ref=f23e256]: "\"When would you use SUMIFS instead of a pivot table?\""
      - paragraph [ref=f23e257]: "Model answer: SUMIFS when you need one specific number embedded in a sentence or a KPI tile (e.g. a single cell feeding a summary dashboard); a pivot table when you need to explore or slice a full dataset interactively. They solve the same aggregation problem in different contexts."
