    - heading "Interview questions for this module" [level=2] [ref=f27e266]
    - generic [ref=f27e267]:
      - paragraph [ref=f27e268]: "\"How do you explain statistical significance to a stakeholder with no stats background?\""
      - paragraph [ref=f27e269]: "Model answer: \"It's how confident we are the difference we're seeing is a real effect, not random noise from a small sample — like flipping a coin 10 times and getting 7 heads doesn't mean the coin is rigged, but 700 heads out of 1,000 flips would.\""
    - generic [ref=f27e270]:
      - paragraph [ref=f27e271]: "\"If LTV:CAC is 1.5:1, what does that tell you and what would you recommend?\""
      - paragraph [ref=f27e272]: "Model answer: unsustainable — the cost of acquiring a customer is too close to what they're worth over their lifetime, leaving little margin for overhead or profit. Recommend either reducing CAC by channel (cut underperforming spend) or increasing retention/LTV (lifecycle marketing) before scaling acquisition spend further."
    - generic [ref=f27e273]:
      - paragraph [ref=f27e274]: "\"How would you determine if you have enough sample size to trust an A/B test result?\""
      - paragraph [ref=f27e275]: "Model answer: run a sample-size calculation before launch based on baseline conversion rate and minimum detectable effect, and commit to that sample size and duration up front — don't stop the test early just because it looks significant on day 3, since that inflates the false-positive rate."
    - generic [ref=f27e276]:
      - paragraph [ref=f27e277]: "\"What's the difference between correlation and causation, and how does it affect your recommendations?\" (real, sourced)"
      - paragraph [ref=f27e278]: "Model answer: correlated metrics can share a third cause (seasonality driving both spend and revenue); recommendations from correlation alone should be framed as testable hypotheses, not proven levers — propose a holdout or A/B test before recommending a budget shift on correlation alone."
    - generic [ref=f27e279]:
      - paragraph [ref=f27e280]: "\"You tested 5 variants and one came back significant — what's the concern?\" (real, sourced)"
      - paragraph [ref=f27e281]: "Model answer: the multiple-comparisons problem — at a 5% threshold and 5 tests, there's roughly a 1-in-4 chance of at least one false positive by pure chance. Correct the threshold (Bonferroni: divide 0.05 by the number of tests) or treat the winner as a hypothesis to re-confirm."
