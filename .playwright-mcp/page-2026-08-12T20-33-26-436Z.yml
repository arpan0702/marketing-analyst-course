    - heading "Exercises" [level=2] [ref=f27e113]
    - list [ref=f27e114]:
      - listitem [ref=f27e115]: Using the calculators above, try a scenario where LTV:CAC is under 2:1 — write one sentence recommending what you'd do.
      - listitem [ref=f27e116]: Using the Kaggle "Marketing A/B Testing" dataset, calculate conversion rate for each group, then check significance (Sheets has a built-in chi-square function) against this page's calculator.
      - listitem [ref=f27e117]: In the significance calculator, drop Variant B's visitor count to 500 with the same conversion rate — watch the result flip. Write two sentences on why that matters when a stakeholder wants to end a test early.
    - generic [ref=f27e118]: Intermediate
    - heading "Sizing a test before you run it" [level=2] [ref=f27e121]
    - paragraph [ref=f27e122]:
      - text: Real teams don't check significance and hope — they calculate the sample size needed
      - emphasis [ref=f27e123]: before launch
      - text: ", using industry-standard"
      - strong [ref=f27e124]: 80% power
      - text: (chance of detecting a real effect if one exists) and
      - strong [ref=f27e125]: 95% confidence
      - text: (chance of not falsely calling noise a real effect). Skipping this is how teams end up running an underpowered test for two weeks and learning nothing.
    - generic [ref=f27e126]:
      - generic [ref=f27e127]: Sample size calculator
      - generic [ref=f27e128]:
        - generic [ref=f27e129]:
          - generic [ref=f27e130]: Baseline conversion rate (%)
          - spinbutton "Baseline conversion rate (%)" [ref=f27e131]: "5"
        - generic [ref=f27e132]:
          - generic [ref=f27e133]: Minimum detectable lift (relative, %)
          - spinbutton "Minimum detectable lift (relative, %)" [ref=f27e134]: "10"
      - generic [ref=f27e135]:
        - generic [ref=f27e136]: Detecting 10% relative lift (5.00% → 5.50%) needs ~31,234 visitors per variant (62,468 total), at 95% confidence / 80% power.
        - generic [ref=f27e137]: Smaller lifts need dramatically more traffic — halving the MDE roughly quadruples the required sample.
    - heading "Choosing the right statistical test, and reading cohorts over time" [level=2] [ref=f27e138]
    - list [ref=f27e139]:
      - listitem [ref=f27e140]:
        - strong [ref=f27e141]: Chi-square test
        - text: ": comparing conversion"
        - emphasis [ref=f27e142]: rates
        - text: "(categorical: converted / didn't) between two groups — what this course's significance calculator runs under the hood."
      - listitem [ref=f27e143]:
        - strong [ref=f27e144]: t-test
        - text: ": comparing"
        - emphasis [ref=f27e145]: averages
        - text: of a continuous number between two groups (e.g. average order value in Variant A vs. B) — different math from a rate comparison, a common trap in interviews.
      - listitem [ref=f27e146]:
        - strong [ref=f27e147]: Confidence intervals
        - text: ": instead of a single \"the lift is 8%,\" a range (\"the lift is between 3% and 13%, 95% confidence\") — more honest, and what you should actually report to a stakeholder asking \"so is it 8% for sure?\""
      - listitem [ref=f27e148]:
        - strong [ref=f27e149]: Retention curves
        - text: ": the row-by-row read of Module 3's cohort heatmap — where retention typically drops steeply in month 1 then flattens; the flattening point is roughly your realistic long-run LTV assumption."
    - generic [ref=f27e150]: Advanced
    - heading "Proving it's causal, not just correlated" [level=2] [ref=f27e153]
    - list [ref=f27e154]:
      - listitem [ref=f27e155]:
        - strong [ref=f27e156]: Correlation vs. causation
        - text: ": spend and revenue moving together doesn't prove spend caused the revenue — both could be driven by seasonality. A recommendation based on correlation alone should be framed as a hypothesis to test, not a proven lever."
      - listitem [ref=f27e157]:
        - strong [ref=f27e158]: Incrementality / holdout testing
        - text: ": deliberately withhold a channel or campaign from a random slice of geography or audience, then compare outcomes vs. the exposed group — this is how you separate \"channel gets credit for a sale\" from \"channel actually caused the sale,\" especially for brand/awareness spend attribution can't cleanly measure."
      - listitem [ref=f27e159]:
        - strong [ref=f27e160]: Multiple testing correction
        - text: ": testing 5 variants at a 5% significance threshold gives roughly a 1-in-4 chance"
        - emphasis [ref=f27e161]: at least one
        - text: "looks \"significant\" purely by chance. A simple fix (Bonferroni correction): divide your significance threshold by the number of comparisons (5 tests → use 0.01, not 0.05, as the bar)."
      - listitem [ref=f27e162]:
        - strong [ref=f27e163]: Simple linear regression, conceptually
        - text: ": fits a line describing how one variable moves with another (e.g. spend vs. revenue) and gives you a slope — useful for marketing-mix-style questions (\"what's the marginal return on the next $1,000 of spend\"), but only as good as the confounding variables you've controlled for."
