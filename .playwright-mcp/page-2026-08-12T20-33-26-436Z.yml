    - generic [ref=f27e18]:
      - paragraph [ref=f27e19]: Module 5
      - heading "Marketing Metrics, A/B Testing & Statistical Fundamentals" [level=1] [ref=f27e20]
      - paragraph [ref=f27e21]: CAC, LTV, ROAS, hypothesis testing, confidence — where "analyst" stops being a title and starts being a way of thinking.
    - generic [ref=f27e22]: Beginner
    - heading "Core concepts" [level=2] [ref=f27e25]
    - list [ref=f27e26]:
      - listitem [ref=f27e27]:
        - strong [ref=f27e28]: CAC
        - text: (Customer Acquisition Cost) = spend ÷ new customers.
      - listitem [ref=f27e29]:
        - strong [ref=f27e30]: LTV
        - text: (Lifetime Value) = avg. order value × purchase frequency × customer lifespan.
      - listitem [ref=f27e31]:
        - strong [ref=f27e32]: ROAS
        - text: (Return on Ad Spend) = revenue ÷ spend. Healthy
        - strong [ref=f27e33]: "LTV : CAC"
        - text: is roughly 3:1 or better.
      - listitem [ref=f27e34]:
        - strong [ref=f27e35]: Statistical significance
        - text: ": whether an observed difference (e.g. Variant B's conversion rate) is likely real, or just noise."
      - listitem [ref=f27e36]:
        - strong [ref=f27e37]: Sample size / peeking risk
        - text: ": checking significance too early inflates false positives — a test that looks \"significant\" on day 3 can flip by day 14."
    - generic [ref=f27e38]:
      - paragraph [ref=f27e39]: acquisition funnel — where each metric lives
