    - heading "Interview questions for this module" [level=2] [ref=f25e290]
    - generic [ref=f25e291]:
      - paragraph [ref=f25e292]: "\"How do you decide what chart type to use for a given dataset?\""
      - paragraph [ref=f25e293]: "Model answer: start from the question, not the data. Comparing categories → bar. Trend over time → line. Part-to-whole → stacked bar (rarely pie). Relationship between two numeric variables → scatter. Precise individual values → a table beats a chart."
    - generic [ref=f25e294]:
      - paragraph [ref=f25e295]: "\"Walk me through how you'd design a dashboard for a CMO who has 30 seconds to look at it.\""
      - paragraph [ref=f25e296]: "Model answer: lead with 3–4 KPI tiles above the fold, each with a trend arrow, no more than one chart requiring interpretation, and a single annotation stating what changed and why it matters — the CMO should never have to ask \"so what should I do with this.\""
    - generic [ref=f25e297]:
      - paragraph [ref=f25e298]: "\"How do you present analysis findings to a non-technical audience?\" (real, sourced)"
      - paragraph [ref=f25e299]: "Model answer: lead with the recommendation (SCQA/Pyramid Principle), not the method — \"We should shift budget from X to Y because Z,\" then offer the analysis behind it only if asked."
