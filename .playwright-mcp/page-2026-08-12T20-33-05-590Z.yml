    - 'heading "Structuring a portfolio case study: SCQA" [level=3] [ref=f25e179]'
    - paragraph [ref=f25e180]:
      - text: When you present Portfolio Project 3 in an interview, structure the narrative with the consulting-standard
      - strong [ref=f25e181]: SCQA
      - text: "framework instead of walking through your process chronologically:"
    - paragraph [ref=f25e183]:
      - strong [ref=f25e184]: Situation
      - text: — the business context, one sentence.
      - strong [ref=f25e185]: Complication
      - text: — what's wrong or uncertain (the CAC jump, the underperforming channel).
      - strong [ref=f25e186]: Question
      - text: — the one question your analysis answers.
      - strong [ref=f25e187]: Answer
      - text: "— your recommendation, stated first, with the supporting data available if asked. This is also called the Pyramid Principle: conclusion first, evidence on demand — the opposite instinct from \"let me walk you through my SQL.\""
