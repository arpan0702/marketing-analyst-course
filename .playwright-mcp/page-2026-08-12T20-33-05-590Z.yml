    - generic [ref=f25e94]: Intermediate
    - heading "Making the tool do more of the thinking" [level=2] [ref=f25e97]
    - list [ref=f25e98]:
      - listitem [ref=f25e99]:
        - strong [ref=f25e100]: Calculated fields
        - text: ": a formula built inside the BI tool (e.g."
        - code [ref=f25e101]: ROAS = SUM(Revenue) / SUM(Spend)
        - text: ) so it recalculates correctly at any level of aggregation, instead of averaging a pre-computed ROAS column (which silently produces the wrong number).
      - listitem [ref=f25e102]:
        - strong [ref=f25e103]: Table calculations
        - text: ": running total, % of total, % change vs. previous period — computed by the tool over the chart's current view, so it stays correct as filters change."
      - listitem [ref=f25e104]:
        - strong [ref=f25e105]: Parameters & filters
        - text: ": a parameter lets a viewer swap what metric a chart shows (e.g. toggle between Spend / Revenue / ROAS) without you building three separate charts."
      - listitem [ref=f25e106]:
        - strong [ref=f25e107]: Small multiples
        - text: ": the same small chart repeated once per channel/segment, side by side — often clearer than one crowded chart with 6 overlapping lines."
