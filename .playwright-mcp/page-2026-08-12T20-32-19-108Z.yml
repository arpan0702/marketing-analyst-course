    - heading "Exercises (do these before moving on)" [level=2] [ref=f22e101]
    - list [ref=f22e102]:
      - listitem [ref=f22e103]: Pick one past campaign. Write the question you were actually trying to answer with its performance data, in one sentence.
      - listitem [ref=f22e104]: List every metric you currently pull in your job. Label each a dimension or a metric.
      - listitem [ref=f22e105]:
        - text: "Rewrite three resume bullets using:"
        - code [ref=f22e106]: "[analytical verb] + [what was measured] + [tool/method] + [quantified result]"
        - text: — before learning any tool. This proves the pivot is framing first, tools second.
    - generic [ref=f22e107]: Intermediate
    - heading "Prioritizing when everyone wants an analysis \"by Friday\"" [level=2] [ref=f22e110]
    - paragraph [ref=f22e111]: Once you're producing real analysis, the job shifts from "can I do this" to "what do I do first." Marketing teams generate more analysis requests than one analyst can serve — the skill is triaging them defensibly, not silently working overtime.
    - list [ref=f22e112]:
      - listitem [ref=f22e113]:
        - strong [ref=f22e114]: ICE scoring
        - text: ": Impact × Confidence ÷ Effort. Quick, good for ranking a backlog of ad-hoc requests."
      - listitem [ref=f22e115]:
        - strong [ref=f22e116]: RICE scoring
        - text: ": Reach × Impact × Confidence ÷ Effort. Adds \"how many people/campaigns does this touch\" — better when requests vary wildly in scope."
      - listitem [ref=f22e117]:
        - strong [ref=f22e118]: The "so what" test
        - text: ": before starting any analysis, write the sentence you expect to end with (\"we should shift budget from X to Y\"). If you can't imagine a sentence that would change a decision, the analysis isn't worth doing yet."
