      - heading "The Transition Mindset & Analytics Foundations" [level=1] [ref=f22e20]
      - paragraph [ref=f22e21]: Reframe what "analysis" means before touching a single tool. Marketing judgment already contains most of the reasoning an analyst uses — this module names it.
    - generic [ref=f22e22]: Beginner
    - 'heading "Start here: what \"being an analyst\" actually means day-to-day" [level=2] [ref=f22e25]'
    - paragraph [ref=f22e26]: "Strip away the job title and an analyst does one thing on repeat: someone has a question (\"why did signups drop?\"), the analyst finds data that can answer it, cleans that data until it's trustworthy, looks for the pattern, draws it so someone else can see the pattern too, and recommends what to do about it. That's the whole job. Every tool in this course (Excel, SQL, Tableau, GA4, statistics) exists only to make one of those six steps faster or more rigorous."
    - heading "Core concepts" [level=2] [ref=f22e27]
    - list [ref=f22e28]:
      - listitem [ref=f22e29]:
        - text: "The analytics workflow:"
        - strong [ref=f22e30]: question → data → clean → analyze → visualize → recommend.
      - listitem [ref=f22e31]: "Vocabulary shift: \"metric\" (a number, like clicks) vs. \"dimension\" (a category, like channel), \"grain\" (what one row represents), \"hypothesis,\" \"confidence.\""
      - listitem [ref=f22e32]: Every marketing skill has an analytical shadow — see the map below.
