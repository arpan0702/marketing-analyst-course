    - generic [ref=f22e140]: Advanced
    - heading "The analytics maturity model — and knowing which level you're operating at" [level=2] [ref=f22e143]
    - paragraph [ref=f22e144]: "Interviewers at the 2-year mark expect you to know where a given piece of work sits on this ladder, and to be honest about which levels you can currently deliver:"
    - list [ref=f22e145]:
      - listitem [ref=f22e146]:
        - strong [ref=f22e147]: Descriptive
        - text: — "what happened" (a dashboard, a report). Most of Modules 1–4.
      - listitem [ref=f22e148]:
        - strong [ref=f22e149]: Diagnostic
        - text: — "why it happened" (funnel breakdowns, cohort analysis, the CAC-jumped-30% case pattern).
      - listitem [ref=f22e150]:
        - strong [ref=f22e151]: Predictive
        - text: — "what will happen" (forecasting, LTV modeling — touched in Module 5's advanced tier).
      - listitem [ref=f22e152]:
        - strong [ref=f22e153]: Prescriptive
        - text: — "what to do about it" (budget reallocation recommendations backed by a test, not just a hunch).
    - paragraph [ref=f22e154]: Most real marketing-analyst work lives at levels 1–2, with occasional forays into 4 when a recommendation is well-supported. Claiming level 3–4 fluency you don't have is a common overreach that gets caught fast in a technical screen — better to be precise about what you've actually done.
    - heading "Biases that quietly wreck an analysis" [level=2] [ref=f22e155]
    - paragraph [ref=f22e157]:
      - strong [ref=f22e158]: Confirmation bias
      - text: — building the query to find what you already expected. Counter it by writing the "so what" sentence
      - emphasis [ref=f22e159]: before
      - text: looking at the data, then checking if the data actually supports it.
      - strong [ref=f22e160]: Survivorship bias
      - text: — analyzing only customers who converted/stayed, missing what churned/bounced customers looked like.
      - strong [ref=f22e161]: Simpson's paradox
      - text: — a trend that holds in every individual segment can reverse when segments are combined (e.g. overall conversion rate drops even though it rose in every channel, because mix shifted toward a lower-converting channel). Always check a segment breakdown before trusting an aggregate trend.
