    - heading "Interview questions for this module" [level=2] [ref=f22e280]
    - generic [ref=f22e281]:
      - paragraph [ref=f22e282]: "\"Walk me through how you'd approach a completely new dataset you've never seen before.\""
      - paragraph [ref=f22e283]: "Model answer: start with the grain (what does one row represent?), check for obvious data quality issues (nulls, duplicates, date ranges), then re-state the business question before writing a single query — most bad analysis comes from skipping this and jumping straight to a pivot table."
    - generic [ref=f22e284]:
      - paragraph [ref=f22e285]: "\"What's the difference between a metric and a dimension?\""
      - paragraph [ref=f22e286]: "Model answer: a metric is a number you aggregate (revenue, clicks, sessions); a dimension is a category you group or filter by (channel, region, device). Every chart or query is really \"which metric, sliced by which dimension.\""
    - generic [ref=f22e287]:
      - paragraph [ref=f22e288]:
        - text: "\"How do you decide which metrics to prioritize when evaluating a marketing program?\" (real, sourced — see the"
        - link "Interview Bank" [ref=f22e289] [cursor=pointer]:
          - /url: interview-bank.html
        - text: )
      - paragraph [ref=f22e290]: "Model answer: anchor to the business goal one level up, pick 1–2 primary metrics that goal implies, treat the rest as diagnostic. A dashboard where everything is \"important\" has no priority at all."
