    - heading "Interview questions for this module" [level=2] [ref=f8e119]
    - generic [ref=f8e120]:
      - paragraph [ref=f8e121]: "\"How would you set up UTM tracking for a new campaign launch across 3 channels?\""
      - paragraph [ref=f8e122]: "Model answer: agree on a naming convention doc first (lowercase, underscores, a fixed list of medium values) before anyone builds a single link — most attribution reporting breaks not from missing UTMs but from inconsistent ones (\"Email\" vs \"email\" vs \"e-mail\" become three different rows)."
    - generic [ref=f8e123]:
      - paragraph [ref=f8e124]: "\"What's the difference between a GA4 event and a key event (conversion)?\""
      - paragraph [ref=f8e125]: "Model answer: every interaction is an event (page_view, scroll, click); a key event is an event you've explicitly marked as meaningful to the business (purchase, form submission) — the subset GA4 optimizes and reports conversions against."
    - generic [ref=f8e126]:
      - paragraph [ref=f8e127]: "\"A campaign's traffic isn't showing up in GA4 — how do you debug it?\""
      - paragraph [ref=f8e128]: "Model answer, in order: (1) check the UTM parameters are actually present and correctly formatted on the live URL, (2) check for an ad blocker or consent-mode issue suppressing the tag, (3) open GTM's Preview mode / GA4 DebugView to confirm the trigger is firing at all before assuming it's a reporting delay."
