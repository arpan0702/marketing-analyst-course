    - heading "Breaking a question into steps" [level=2] [ref=f24e128]
    - list [ref=f24e129]:
      - listitem [ref=f24e130]:
        - strong [ref=f24e131]: CTEs
        - text: (
        - code [ref=f24e132]: WITH name AS (...)
        - text: "): name an intermediate result so a complex query reads top-to-bottom instead of as nested parentheses. Anywhere you'd build one pivot table, then a second pivot table off the first, a CTE is that same move in SQL."
      - listitem [ref=f24e133]:
        - strong [ref=f24e134]: Subqueries
        - text: ": a query inside a query, often to filter against a computed value (e.g. \"channels above the average revenue\" — you can't write"
        - code [ref=f24e135]: WHERE revenue > AVG(revenue)
        - text: directly, the average has to be computed first).
      - listitem [ref=f24e136]:
        - strong [ref=f24e137]: HAVING vs. WHERE
        - text: ":"
        - code [ref=f24e138]: WHERE
        - text: filters rows before grouping;
        - code [ref=f24e139]: HAVING
        - text: filters groups after aggregation (e.g. "channels with more than 5 orders").
      - listitem [ref=f24e140]:
        - strong [ref=f24e141]: COALESCE
        - text: ":"
        - code [ref=f24e142]: COALESCE(discount, 0)
        - text: substitutes a default when a value is NULL — the SQL version of Module 1's blank-handling.
      - listitem [ref=f24e143]:
        - strong [ref=f24e144]: Date functions
        - text: ": pulling a month or week out of a full date (SQLite:"
        - code [ref=f24e145]: strftime('%Y-%m', order_date)
        - text: ) — this is how the
        - code [ref=f24e146]: month
        - text: column in this dataset was actually derived.
