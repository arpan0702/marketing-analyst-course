    - heading "Interview questions for this module" [level=2] [ref=f24e290]
    - generic [ref=f24e291]:
      - paragraph [ref=f24e292]: "\"Write a query to find the top 3 campaigns by conversion rate in each region.\""
      - paragraph [ref=f24e293]:
        - text: "Model answer: use"
        - code [ref=f24e294]: RANK() OVER (PARTITION BY region ORDER BY conversion_rate DESC)
        - text: in a subquery, then filter the outer query to rank <= 3. Partitioning is the key idea — it resets the ranking within each region instead of across the whole table.
    - generic [ref=f24e295]:
      - paragraph [ref=f24e296]: "\"What's the difference between INNER JOIN and LEFT JOIN, and when would a marketing analyst care?\""
      - paragraph [ref=f24e297]:
        - text: "Model answer: INNER JOIN only keeps rows with a match in both tables; LEFT JOIN keeps every row from the left table even without a match. A LEFT JOIN matters for churn or inactivity analysis — you need customers with"
        - emphasis [ref=f24e298]: zero
        - text: orders to show up, not disappear.
    - generic [ref=f24e299]:
      - paragraph [ref=f24e300]: "\"How would you find month-over-month percent change in spend using SQL?\""
      - paragraph [ref=f24e301]:
        - text: "Model answer:"
        - code [ref=f24e302]: LAG(spend) OVER (PARTITION BY channel ORDER BY month)
        - text: to get the prior month's value in the same row, then compute
        - code [ref=f24e303]: (spend - prior_spend) / prior_spend
        - text: .
    - generic [ref=f24e304]:
      - paragraph [ref=f24e305]:
        - text: "Real, sourced: \"Given two dates, return one row per week between them, numbered sequentially.\" (see the"
        - link "Interview Bank" [ref=f24e306] [cursor=pointer]:
          - /url: interview-bank.html
        - text: for source)
      - paragraph [ref=f24e307]: "Model answer: this is a \"date spine\" problem — generate a continuous sequence of dates or week numbers (a recursive CTE, or a pre-built calendar table), then join your real data onto it so weeks with zero activity still appear as a row instead of silently disappearing."
    - generic [ref=f24e308]:
      - paragraph [ref=f24e309]: "\"How would you handle missing data or outliers when using SQL for marketing analysis?\" (real, sourced)"
      - paragraph [ref=f24e310]:
        - text: "Model answer: for missing values, decide explicitly between"
        - code [ref=f24e311]: COALESCE
        - text: "-to-a-default, excluding the row, or flagging it — and say which. For outliers, don't silently delete: a $50,000 single order might be a real enterprise deal, not a data error. Check before excluding, and disclose it in the write-up if you do."
