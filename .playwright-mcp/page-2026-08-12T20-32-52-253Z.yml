    - heading "Cohort analysis & working with real analytics exports" [level=2] [ref=f24e154]
    - list [ref=f24e155]:
      - listitem [ref=f24e156]:
        - strong [ref=f24e157]: Cohort retention
        - text: ": group customers by their signup month, then track how many of each cohort ordered in each subsequent month — the query the \"improve retention\" case interview question is actually asking for."
      - listitem [ref=f24e158]:
        - strong [ref=f24e159]: Correlated subqueries
        - text: ": a subquery that references the outer query's current row (e.g. \"each customer's revenue vs. their own country's average\") — powerful but can be slow on large tables; a window function is often the faster equivalent."
      - listitem [ref=f24e160]:
        - strong [ref=f24e161]: Query performance (conceptually)
        - text: ": an index is like a book's table of contents for a column — it lets the database find matching rows without scanning every one. You won't be building indexes as a marketing analyst, but knowing why a query on a 50M-row events table is slow (no index on the filtered column) is a real interview topic."
      - listitem [ref=f24e162]:
        - strong [ref=f24e163]: GA4's BigQuery export schema
        - text: ": unlike this course's flat"
        - code [ref=f24e164]: orders
        - text: table, GA4's export stores event parameters as a
        - emphasis [ref=f24e165]: nested, repeated
        - text: field — you need
        - code [ref=f24e166]: UNNEST(event_params)
        - text: to flatten them into rows before you can filter or aggregate on a specific parameter like
        - code [ref=f24e167]: campaign
        - text: . This single function is the biggest jump from this course's schema to a real GA4 SQL analysis (see Module 4, Advanced).
