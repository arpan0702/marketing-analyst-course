    - 'heading "Start here: three tools, one pipeline" [level=2] [ref=f19e21]'
    - paragraph [ref=f19e22]: GA4, GTM, and UTMs are three different things that get confused constantly. A UTM is a tag on a URL (data about where a click came from). GTM is the deployment mechanism (it fires tracking code without an engineer touching the site). GA4 is where the data lands and gets reported. One flows into the next — see the pipeline below.
