    - heading "Interview questions for this module" [level=2] [ref=f19e142]
    - generic [ref=f19e143]:
      - paragraph [ref=f19e144]: "\"How would you set up UTM tracking for a new campaign launch across 3 channels?\""
      - paragraph [ref=f19e145]: "Model answer: agree on a naming convention doc first (lowercase, underscores, a fixed list of medium values) before anyone builds a single link — most attribution reporting breaks not from missing UTMs but from inconsistent ones (\"Email\" vs \"email\" vs \"e-mail\" become three different rows)."
    - generic [ref=f19e146]:
      - paragraph [ref=f19e147]: "\"What's the difference between a GA4 event and a key event (conversion)?\""
      - paragraph [ref=f19e148]: "Model answer: every interaction is an event (page_view, scroll, click); a key event is an event you've explicitly marked as meaningful to the business (purchase, form submission) — the subset GA4 optimizes and reports conversions against."
    - generic [ref=f19e149]:
      - paragraph [ref=f19e150]: "\"A campaign's traffic isn't showing up in GA4 — how do you debug it?\""
      - paragraph [ref=f19e151]: "Model answer, in order: (1) check the UTM parameters are actually present and correctly formatted on the live URL, (2) check for an ad blocker or consent-mode issue suppressing the tag, (3) open GTM's Preview mode / GA4 DebugView to confirm the trigger is firing at all before assuming it's a reporting delay."
