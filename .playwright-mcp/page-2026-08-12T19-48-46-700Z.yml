    - heading "Interview questions for this module" [level=2] [ref=f20e184]
    - generic [ref=f20e185]:
      - paragraph [ref=f20e186]: "\"How do you explain statistical significance to a stakeholder with no stats background?\""
      - paragraph [ref=f20e187]: "Model answer: \"It's how confident we are the difference we're seeing is a real effect, not random noise from a small sample — like flipping a coin 10 times and getting 7 heads doesn't mean the coin is rigged, but 700 heads out of 1,000 flips would.\""
    - generic [ref=f20e188]:
      - paragraph [ref=f20e189]: "\"If LTV:CAC is 1.5:1, what does that tell you and what would you recommend?\""
      - paragraph [ref=f20e190]: "Model answer: unsustainable — the cost of acquiring a customer is too close to what they're worth over their lifetime, leaving little margin for overhead or profit. Recommend either reducing CAC by channel (cut underperforming spend) or increasing retention/LTV (lifecycle marketing) before scaling acquisition spend further."
    - generic [ref=f20e191]:
      - paragraph [ref=f20e192]: "\"How would you determine if you have enough sample size to trust an A/B test result?\""
      - paragraph [ref=f20e193]: "Model answer: run a sample-size calculation before launch based on baseline conversion rate and minimum detectable effect, and commit to that sample size and duration up front — don't stop the test early just because it looks significant on day 3, since that inflates the false-positive rate."
