      - paragraph [ref=f20e18]: Module 5
      - heading "Marketing Metrics, A/B Testing & Statistical Fundamentals" [level=1] [ref=f20e19]
      - paragraph [ref=f20e20]: CAC, LTV, ROAS, hypothesis testing, confidence — where "analyst" stops being a title and starts being a way of thinking.
    - heading "Core concepts" [level=2] [ref=f20e21]
    - list [ref=f20e22]:
      - listitem [ref=f20e23]:
        - strong [ref=f20e24]: CAC
        - text: (Customer Acquisition Cost) = spend ÷ new customers.
      - listitem [ref=f20e25]:
        - strong [ref=f20e26]: LTV
        - text: (Lifetime Value) = avg. order value × purchase frequency × customer lifespan.
      - listitem [ref=f20e27]:
        - strong [ref=f20e28]: ROAS
        - text: (Return on Ad Spend) = revenue ÷ spend. Healthy
        - strong [ref=f20e29]: "LTV : CAC"
        - text: is roughly 3:1 or better.
      - listitem [ref=f20e30]:
        - strong [ref=f20e31]: Statistical significance
        - text: ": whether an observed difference (e.g. Variant B's conversion rate) is likely real, or just noise."
      - listitem [ref=f20e32]:
        - strong [ref=f20e33]: Sample size / peeking risk
        - text: ": checking significance too early inflates false positives — a test that looks \"significant\" on day 3 can flip by day 14."
    - generic [ref=f20e34]:
