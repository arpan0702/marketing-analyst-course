    - heading "Interview questions for this module" [level=2] [ref=f7e165]
    - generic [ref=f7e166]:
      - paragraph [ref=f7e167]: "\"Write a query to find the top 3 campaigns by conversion rate in each region.\""
      - paragraph [ref=f7e168]:
        - text: "Model answer: use"
        - code [ref=f7e169]: RANK() OVER (PARTITION BY region ORDER BY conversion_rate DESC)
        - text: in a subquery, then filter the outer query to rank <= 3. Partitioning is the key idea — it resets the ranking within each region instead of across the whole table.
    - generic [ref=f7e170]:
      - paragraph [ref=f7e171]: "\"What's the difference between INNER JOIN and LEFT JOIN, and when would a marketing analyst care?\""
      - paragraph [ref=f7e172]:
        - text: "Model answer: INNER JOIN only keeps rows with a match in both tables; LEFT JOIN keeps every row from the left table even without a match. A LEFT JOIN matters for churn or inactivity analysis — you need customers with"
        - emphasis [ref=f7e173]: zero
        - text: orders to show up, not disappear.
    - generic [ref=f7e174]:
      - paragraph [ref=f7e175]: "\"How would you find month-over-month percent change in spend using SQL?\""
      - paragraph [ref=f7e176]:
        - text: "Model answer:"
        - code [ref=f7e177]: LAG(spend) OVER (PARTITION BY channel ORDER BY month)
        - text: to get the prior month's value in the same row, then compute
        - code [ref=f7e178]: (spend - prior_spend) / prior_spend
        - text: .
