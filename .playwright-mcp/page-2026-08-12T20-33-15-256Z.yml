    - heading "Interview questions for this module" [level=2] [ref=f26e213]
    - generic [ref=f26e214]:
      - paragraph [ref=f26e215]: "\"How would you set up UTM tracking for a new campaign launch across 3 channels?\""
      - paragraph [ref=f26e216]: "Model answer: agree on a naming convention doc first (lowercase, underscores, a fixed list of medium values) before anyone builds a single link — most attribution reporting breaks not from missing UTMs but from inconsistent ones (\"Email\" vs \"email\" vs \"e-mail\" become three different rows)."
    - generic [ref=f26e217]:
      - paragraph [ref=f26e218]: "\"What's the difference between a GA4 event and a key event (conversion)?\""
      - paragraph [ref=f26e219]: "Model answer: every interaction is an event (page_view, scroll, click); a key event is an event you've explicitly marked as meaningful to the business (purchase, form submission) — the subset GA4 optimizes and reports conversions against."
    - generic [ref=f26e220]:
      - paragraph [ref=f26e221]: "\"A campaign's traffic isn't showing up in GA4 — how do you debug it?\""
      - paragraph [ref=f26e222]: "Model answer, in order: (1) check the UTM parameters are actually present and correctly formatted on the live URL, (2) check for an ad blocker or consent-mode issue suppressing the tag, (3) open GTM's Preview mode / GA4 DebugView to confirm the trigger is firing at all before assuming it's a reporting delay."
    - generic [ref=f26e223]:
      - paragraph [ref=f26e224]: "\"How would you build a marketing attribution model when you have incomplete data across channels?\" (real, sourced)"
      - paragraph [ref=f26e225]: "Model answer: state the limitation up front, then triangulate — use GA4's multi-touch view where available, supplement with a lift/holdout test for channels attribution can't see well (brand, offline), and be explicit about which channels' numbers you trust and which you don't."
    - generic [ref=f26e226]:
      - paragraph [ref=f26e227]: "\"How do you reconcile GA4 numbers that don't match your CRM or ad platform reports?\" (real, sourced)"
      - paragraph [ref=f26e228]: "Model answer: this is expected, not a bug — different attribution windows, client-side tracking loss, and ad platforms self-reporting generously all contribute. Pick a source of truth per decision and say which, rather than trying to make all three numbers agree."
