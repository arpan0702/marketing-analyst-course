    - 'heading "Beyond pageviews: tracking what actually matters to the business" [level=2] [ref=f26e95]'
    - list [ref=f26e96]:
      - listitem [ref=f26e97]:
        - strong [ref=f26e98]: Enhanced ecommerce events
        - text: ":"
        - code [ref=f26e99]: view_item
        - text: ","
        - code [ref=f26e100]: add_to_cart
        - text: ","
        - code [ref=f26e101]: begin_checkout
        - text: ","
        - code [ref=f26e102]: purchase
        - text: — GA4's built-in vocabulary for a purchase funnel, so you're not inventing custom event names for standard behavior.
      - listitem [ref=f26e103]:
        - strong [ref=f26e104]: Custom dimensions & metrics
        - text: ": GA4 doesn't know your business's specific concepts (loyalty tier, lead source) until you register them as custom dimensions — otherwise that data arrives as an event parameter but never becomes a usable report column."
      - listitem [ref=f26e105]:
        - strong [ref=f26e106]: Audiences
        - text: ": a saved segment definition (e.g. \"added to cart but didn't purchase in 7 days\") reusable across reports and exportable to Google Ads for remarketing — the bridge between analytics and media buying."
      - listitem [ref=f26e107]:
        - strong [ref=f26e108]: GA4 + Google Ads linking
        - text: ": without this link, Ads campaign performance and GA4 on-site behavior live in two disconnected systems — linking is what makes an \"assisted conversions\" or full-funnel view possible at all."
      - listitem [ref=f26e109]:
        - strong [ref=f26e110]: Consent Mode
        - text: ": when a visitor declines cookies, GA4 models (statistically estimates) the missing conversions rather than showing zero — worth knowing this exists so a sudden regional dip doesn't get mis-diagnosed as a real drop."
    - generic [ref=f26e111]: Advanced
    - heading "Attribution modeling & where the real edge cases live" [level=2] [ref=f26e114]
    - generic [ref=f26e115]:
      - generic [ref=f26e116]: Worth knowing before this comes up
      - text: GA4 defaults to data-driven attribution (DDA), but DDA needs roughly
      - strong [ref=f26e117]: 300–400 monthly conversions
      - text: on a specific conversion event to compute reliably. Below that threshold, GA4 silently reverts to a last-click-style model — with no warning anywhere in the UI. On a lower-volume conversion event, check this explicitly before trusting an attribution report.
    - list [ref=f26e118]:
      - listitem [ref=f26e119]:
        - strong [ref=f26e120]: Multi-touch vs. last-touch
        - text: ": multi-touch models (linear, time-decay, data-driven) better credit mid-funnel channels like content and email that warm a prospect up before the final click; last-touch is reasonable for channels where the final decision genuinely is that channel's work, like branded paid search."
      - listitem [ref=f26e121]:
        - strong [ref=f26e122]: Server-side GTM
        - text: ": instead of the browser sending tracking data directly to every vendor (Google, Meta, etc.), the browser sends it once to a server you control, which forwards it onward — improves data accuracy against ad blockers and gives you a single point to filter/enrich data before it leaves your system. You won't set this up as a marketing analyst, but you should recognize the term when a data/eng team mentions it."
      - listitem [ref=f26e123]:
        - strong [ref=f26e124]: Cross-domain tracking
        - text: ": if a checkout lives on a different domain than the main site, GA4 needs to be explicitly configured to pass the client ID across that domain boundary, or every checkout session gets counted as two separate sessions from two \"different\" visitors."
      - listitem [ref=f26e125]:
        - strong [ref=f26e126]: Reconciling GA4 vs. CRM vs. ad platform numbers
        - text: ": these will never match exactly, and that's expected — different attribution windows, client-side tracking loss (ad blockers, iOS ITP/Safari ITP), and ad platforms self-reporting more generous attribution than GA4's model all contribute. Pick one source of truth per decision and say which, rather than trying to force all three into agreement."
