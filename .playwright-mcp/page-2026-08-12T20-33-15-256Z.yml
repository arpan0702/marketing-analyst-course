    - heading "Exercises" [level=2] [ref=f26e85]
    - list [ref=f26e86]:
      - listitem [ref=f26e87]: Explore Google's public GA4 demo property ("Google Merchandise Store") and find the Explorations funnel report.
      - listitem [ref=f26e88]: Design a full UTM naming convention doc for a hypothetical 3-channel launch (paid social, email, paid search) — write it down, don't just build one URL.
      - listitem [ref=f26e89]: In GTM's free sandbox mode, configure one tag + trigger for a button-click event.
      - listitem [ref=f26e90]:
        - text: Query the public BigQuery GA4 sample dataset (
        - code [ref=f26e91]: bigquery-public-data.ga4_obfuscated_sample_ecommerce
        - text: ) with Module 2 SQL skills — this step is what most career-changers skip, and it's the differentiator.
