      - paragraph [ref=f21e21]: Not invented practice questions — these are pulled from public interview-question aggregators (DataLemur, InterviewQuery, FinalRound AI, Glassdoor candidate reports) for Marketing Analyst / Growth Analyst roles around 1–3 years of experience, current as of August 2026. Full source list at the bottom.
