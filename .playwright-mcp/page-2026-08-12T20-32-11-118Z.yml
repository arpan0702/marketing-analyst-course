    - generic [ref=f21e29]:
      - generic [ref=f21e160]:
        - paragraph [ref=f21e161]:
          - text: Write a query to identify the top 3 marketing channels by ROI last quarter.
          - generic [ref=f21e162]: InterviewQuery
        - paragraph [ref=f21e163]: SUM(revenue - spend) or revenue/spend per channel, GROUP BY channel, ORDER BY that value DESC, LIMIT 3. Say the metric choice out loud — "ROI" is ambiguous between profit-based and ratio-based, and picking one and stating why is part of the answer.
      - generic [ref=f21e164]:
        - paragraph [ref=f21e165]:
          - text: Given two dates, return one row per week between them, numbered sequentially, accounting for a start date that falls mid-week.
          - generic [ref=f21e166]: InterviewQuery — Business Analyst SQL
        - paragraph [ref=f21e167]: This is a "date spine" problem. Generate a sequence of dates (a recursive CTE, or a numbers/calendar table), bucket each into a week using a difference from the start date divided by 7, then aggregate. The trap is assuming every week starts on the same weekday as the data — it starts from your given start date.
      - generic [ref=f21e168]:
        - paragraph [ref=f21e169]:
          - text: Compute a frequency table of a customer attribute (e.g. segment) that requires two JOINs, with correct GROUP BY / ORDER BY and NULL handling.
          - generic [ref=f21e170]: InterviewQuery
        - paragraph [ref=f21e171]: JOIN the two lookup tables first, then GROUP BY the attribute, COUNT(*), and explicitly decide what happens to NULLs — do they get their own bucket ("Unknown") or get filtered? Silently dropping NULLs from a marketing segmentation query is a common real mistake that skews the read.
      - generic [ref=f21e172]:
        - paragraph [ref=f21e173]:
          - text: How would you use SQL to analyze customer segmentation or campaign performance?
          - generic [ref=f21e174]: DataLemur
        - paragraph [ref=f21e175]: "Name the grain first (one row = one customer or one order?), then walk the RFM pattern from Module 2/Portfolio Project 1: GROUP BY customer, aggregate recency/frequency/monetary, then bucket with CASE WHEN."
      - generic [ref=f21e176]:
        - paragraph [ref=f21e177]:
          - text: How do you handle missing data or outliers when using SQL for marketing analysis?
          - generic [ref=f21e178]: DataLemur
        - paragraph [ref=f21e179]: "Missing: decide COALESCE-to-default vs. exclude vs. flag, and say which you picked and why. Outliers: don't silently delete them — a $50,000 single order might be real (an enterprise deal) or a data error; check before excluding, and if you exclude, say so in the analysis, not just in the query."
      - generic [ref=f21e180]:
        - paragraph [ref=f21e181]:
          - text: Practice problems worth doing beyond this course
          - generic [ref=f21e182]: DataLemur
        - paragraph [ref=f21e183]: DataLemur's "Google Ad Campaign ROAS" and "Facebook Advertiser Status" problems are built specifically around marketing schemas — good next step after Module 2's live SQL runner.
