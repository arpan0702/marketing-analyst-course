    - heading "Interview questions for this module" [level=2] [ref=f17e191]
    - generic [ref=f17e192]:
      - paragraph [ref=f17e193]: "\"Write a query to find the top 3 campaigns by conversion rate in each region.\""
      - paragraph [ref=f17e194]:
        - text: "Model answer: use"
        - code [ref=f17e195]: RANK() OVER (PARTITION BY region ORDER BY conversion_rate DESC)
        - text: in a subquery, then filter the outer query to rank <= 3. Partitioning is the key idea — it resets the ranking within each region instead of across the whole table.
    - generic [ref=f17e196]:
      - paragraph [ref=f17e197]: "\"What's the difference between INNER JOIN and LEFT JOIN, and when would a marketing analyst care?\""
      - paragraph [ref=f17e198]:
        - text: "Model answer: INNER JOIN only keeps rows with a match in both tables; LEFT JOIN keeps every row from the left table even without a match. A LEFT JOIN matters for churn or inactivity analysis — you need customers with"
        - emphasis [ref=f17e199]: zero
        - text: orders to show up, not disappear.
    - generic [ref=f17e200]:
      - paragraph [ref=f17e201]: "\"How would you find month-over-month percent change in spend using SQL?\""
      - paragraph [ref=f17e202]:
        - text: "Model answer:"
        - code [ref=f17e203]: LAG(spend) OVER (PARTITION BY channel ORDER BY month)
        - text: to get the prior month's value in the same row, then compute
        - code [ref=f17e204]: (spend - prior_spend) / prior_spend
        - text: .
