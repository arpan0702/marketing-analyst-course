    - heading "Interview questions for this module" [level=2] [ref=f18e144]
    - generic [ref=f18e145]:
      - paragraph [ref=f18e146]: "\"How do you decide what chart type to use for a given dataset?\""
      - paragraph [ref=f18e147]: "Model answer: start from the question, not the data. Comparing categories → bar. Trend over time → line. Part-to-whole → stacked bar (rarely pie). Relationship between two numeric variables → scatter. Precise individual values → a table beats a chart."
    - generic [ref=f18e148]:
      - paragraph [ref=f18e149]: "\"Walk me through how you'd design a dashboard for a CMO who has 30 seconds to look at it.\""
      - paragraph [ref=f18e150]: "Model answer: lead with 3–4 KPI tiles above the fold, each with a trend arrow, no more than one chart requiring interpretation, and a single annotation stating what changed and why it matters — the CMO should never have to ask \"so what should I do with this.\""
