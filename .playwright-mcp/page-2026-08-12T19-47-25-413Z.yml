      - heading "The Transition Mindset & Analytics Foundations" [level=1] [ref=f15e19]
      - paragraph [ref=f15e20]: Reframe what "analysis" means before touching a single tool. Marketing judgment already contains most of the reasoning an analyst uses — this module names it.
    - 'heading "Start here: what \"being an analyst\" actually means day-to-day" [level=2] [ref=f15e21]'
    - paragraph [ref=f15e22]: "Strip away the job title and an analyst does one thing on repeat: someone has a question (\"why did signups drop?\"), the analyst finds data that can answer it, cleans that data until it's trustworthy, looks for the pattern, draws it so someone else can see the pattern too, and recommends what to do about it. That's the whole job. Every tool in this course (Excel, SQL, Tableau, GA4, statistics) exists only to make one of those six steps faster or more rigorous."
